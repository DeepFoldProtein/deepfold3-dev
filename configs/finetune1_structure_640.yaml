base: initial.yaml

training:
  max_tokens: 640
  max_atoms: 6912  # 640×10.8 — scaled from 4096 (384-era ~10.67 atoms/tok); 4096 caps protein crops at ~512 tok
  diffusion_batch_size: 32
  diffusion_chunk_size: 8

  alpha_diffusion: 4.0
  alpha_distogram: 0.03
  alpha_confidence: 0.0
  alpha_pae: 0.0
  alpha_bond: 1.0
  alpha_smooth_lddt: null

  finetune_scheduler: cosine
  cosine_max_steps: 20000

  load_strict: true
  skip_load_optimizer: true
  skip_load_scheduler: true
  skip_load_step: true

# To inherit the full stage-1 optimizer setup (Schedule-Free AdamW,
# weight_decay=0.05, lr=0.001, …), chain configs at submit time:
#   --config configs/schedule_free.yaml --config configs/finetune1_structure_640.yaml
# Click last-wins handles the duplicate --config; finetune1's training
# overrides (cosine LR / max_tokens / alphas) take precedence.
model:
  data:
    max_chains: 20
