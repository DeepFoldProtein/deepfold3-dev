base: initial.yaml

training:
  max_tokens: 640
  max_atoms: 4096
  diffusion_batch_size: 32
  diffusion_chunk_size: 16

  alpha_diffusion: 4.0
  alpha_distogram: 0.03
  alpha_confidence: 0.0
  alpha_pae: 0.0
  alpha_bond: 1.0
  alpha_smooth_lddt: null

  finetune_scheduler: cosine
  cosine_max_steps: 20000

  load_strict: true
  skip_load_optimizer: true
  skip_load_scheduler: true
  skip_load_step: true

# Architectural flags must match the stage-1 checkpoint loaded via --params.
# Upstream stage 1 (configs/schedule_free.yaml) enables DeepNet residual
# scaling on both PairFormer stacks; without these flags here the stage-2
# model would build a different forward pass and silently mis-apply the
# loaded weights (load_state_dict reports missing=0, unexpected=0 because
# only forward-pass scalars change).
#
# To inherit the full stage-1 optimizer setup (Schedule-Free AdamW,
# weight_decay=0.05, lr=0.001, …), chain configs at submit time:
#   --config configs/schedule_free.yaml --config configs/finetune1_structure_640.yaml
# Click last-wins handles the duplicate --config; finetune1's training
# overrides (cosine LR / max_tokens / alphas) take precedence.
model:
  pairformer:
    deepnet_residual_scale: true
  confidence:
    deepnet_residual_scale: true
  data:
    max_chains: 20
