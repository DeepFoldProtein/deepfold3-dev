base: df3-stage0-r16.yaml

# r17 — pair-track arm on top of r16's widths (c_z=256, c_m=128).
# Design note + measurements: export/mhr-trimul/README.md
#
# Two changes, both confined to the trunk pair track:
#
#   1. Triangle attention deleted from every Evoformer and PairFormer block.
#      Measured with r16's fusion flags at c_z=256, a full PairFormer block
#      costs 2.35x the no-triangle-attention block at N=384 (3.06x at N=640).
#      This is a subtraction of capability, not just of FLOPs: triangle
#      attention is the only pair operator whose selection over the
#      intermediate node k is conditioned on the target pair (i,j), and the
#      only one whose mixing over k is softmax-normalized.
#
#   2. TriangleMul -> MHR-TriMul, with BOTH halves active. The contraction is
#      untouched; its output is normalized per head (LayerNorm over d=32) and
#      then routed by g = H*softmax(R(x_ij)) before the output projection. The
#      router makes W_o input-dependent over its column blocks, which the AF3
#      output gate (acting *after* W_o) cannot express.
#
#      NOTE — this file previously said `trimul_head_norm: channel`, i.e. the
#      router alone against AF3's LayerNorm over all of c_z. It did not run that
#      way: `_mhr_head_mix` had no branch for "channel" and fell through to the
#      per-head LayerNorm case, so from step 0 this run has had per-head
#      normalization as well. The code is fixed (see 24b501c); the config is
#      changed here to `head_ln` to match what the run has actually been doing
#      rather than to change the model mid-flight.
#
#      The cost is attribution. Holding per-head norm back was meant to keep a
#      shortfall traceable -- the router is instrumented (router/entropy,
#      router/g_std) and lesionable by zeroing W_r, per-head norm is neither. As
#      it stands a shortfall against r16 has three possible causes, not one.
#      What is gained: with per-head norm active the head magnitudes are
#      equalized, so the logged g *is* the per-head contribution.

# Depth (48) and crop are held at r16's values so the subtraction stays clean;
# the speedup is banked as steps, and the r16 comparison should be reported at
# BOTH iso-step and iso-wall-clock. From-scratch — not warm-startable from r16
# (the deleted attention blocks and the router change the parameter set).
#
# Scope: trunk only. The template PairFormer (2 layers, its own block class)
# and the confidence-head PairFormer keep AF3 triangle attention and AF3
# TriangleMul, so the read-out heads are not confounded with the trunk arm.

training:
  wandb_project: deepfold3-v2
  # Unchanged from r16 on purpose. The block now carries 5 residual branches
  # instead of 7, which changes residual variance accumulation; holding lr
  # fixed keeps that as part of what the arm measures rather than a
  # co-varying knob. Revisit only on evidence.
  lr: 0.9e-3

model:
  evoformer:
    use_triangle_attention: false
    trimul_num_heads: 8 # 256 / 8 = 32 per head
    trimul_head_norm: head_ln # r18: head_rms (drops the mean subtraction)
    trimul_router: true

  pairformer:
    use_triangle_attention: false
    trimul_num_heads: 8
    trimul_head_norm: head_ln # r18: head_rms (drops the mean subtraction)
    trimul_router: true
