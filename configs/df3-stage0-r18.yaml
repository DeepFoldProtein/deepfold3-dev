base: df3-stage0-r17.yaml

# r18 — the second half of MHR-TriMul, warm-started from r17.
# Design note: export/mhr-trimul/README.md §3-4
#
# r17 runs the router against *per-head LayerNorm* (see the note in
# df3-stage0-r17.yaml: it was configured for AF3's LayerNorm over c_z but a
# missing branch gave it per-head normalization from step 0). So the change here
# is smaller than originally planned: head_ln -> head_rms, i.e. drop the mean
# subtraction, keep the gain.
#
# Why drop it: at d = 32 the LayerNorm mean is estimated from 32 samples, so it
# carries sigma/sqrt(32) ~ 0.18 sigma of noise and subtracts that from the
# signal, while the variance estimate has ~25% relative error. RMSNorm removes
# the mean term outright. head_rms also has no shift at all -- norm_center is
# built without a bias in that mode -- which is why load_strict has to be off.
#
# Both modes equalize head magnitudes, so the property r17 already has (logged g
# equals the per-head contribution) is preserved.

# Warm start (not from scratch):
#
#   deepfold3 train --config configs/df3-stage0-r18.yaml \
#       --params runs/r17/checkpoint_<step>.pt --output runs/r18
#
# The per-head gain reuses norm_center.weight viewed as [H, d], so shapes line
# up — but head_rms is RMSNorm proper (gain, no shift), so norm_center.bias does
# not exist here while r17's checkpoint has it. Hence load_strict: false; the
# only key it forgives is that bias. And LN_c != RMSNorm_d is a function change,
# so this needs re-equilibration rather than the ~2-3k an identity-initialized
# change would read in. The optimizer state is reset: its second moments were
# accumulated under a different post-contraction normalization and carrying them
# over would fight the change.
#
# ── Ablation grid ────────────────────────────────────────────────────────────
# The remaining two cells need no config file — they are one-line overrides,
# passed through EXTRA_ARGS so the trainjob YAML is never edited:
#
#   plain no-TriAttn baseline (no router, LN_c):
#     --config configs/df3-stage0-r17.yaml \
#     --override model.evoformer.trimul_router=false \
#     --override model.pairformer.trimul_router=false
#
#   cell B (per-head norm, no router) — the reference-class cell, predicted
#   harmful; if it is NOT worse than the baseline, the coupling argument above
#   is wrong and r18's premise fails:
#     --config configs/df3-stage0-r18.yaml \
#     --override model.evoformer.trimul_router=false \
#     --override model.pairformer.trimul_router=false
#
# Read `router/entropy` on both r17 and r18. It is H(g)/log H averaged over
# pairs and layers; 1.0 means the router never left uniform, i.e. it is inert
# and the module is functionally AF3 TriMul. If r18's entropy drops well below
# r17's, the per-head norm did what it was added to do — hand the router real
# authority — regardless of which way the benchmark moves.

training:
  wandb_project: deepfold3-v2
  # r17 (head_ln) carries norm_center.bias; head_rms does not define it.
  load_strict: false
  # Second moments were accumulated under head_ln; they do not describe the
  # head_rms parameterization and would fight the change.
  skip_load_optimizer: true

model:
  evoformer:
    trimul_head_norm: head_rms

  pairformer:
    trimul_head_norm: head_rms
