base: stage1.yaml

# Stage 2 = stage 1 + stochastic atomization of interface residues.
#
# Purpose (regularization only): a random subset of standard polymer residues at
# a chain interface is expanded from one residue token to one token per heavy
# atom — the layout modified residues, glycans and bonded ligands already use at
# inference. Training-time only; inference never atomizes standard residues.
#
# The eval split is left un-atomized (`atomize_eval: false`, the default): it is
# scored on what gets served, and its loss stays directly comparable to stage 1's
# — the train curve alone moves when atomization turns on. Set it true only to
# read eval as a like-for-like continuation of the stage-2 training curve.
#
# --- Sizing atomize_prob -------------------------------------------------
# Measured on 400 random multi-chain patchr assemblies (15 A cross-chain cutoff,
# matching model.data.interface_distance):
#   phi   = interface residues / all tokens        mean 0.541  (p10 0.21, p90 0.85)
#   a_bar = heavy atoms per interface residue      7.98
#   natural one-atom-token fraction                mean 0.076, median 0.018
#                                                  (61% of records have any)
#
# Atomizing one residue turns 1 token into a_bar tokens, i.e. costs (a_bar - 1)
# = 6.98 extra token slots out of the N_c = 512 crop budget. Selection runs
# PRE-crop over the whole assembly and the crop then keeps ~N_c/N_tot of them,
# so the assembly size cancels:
#
#   E[k in crop]        = p * phi * N_c                    = 277 * p
#   residue coverage lost = (a_bar - 1) * p * phi          = 3.8% per 0.01 of p
#   atom tokens added     = a_bar * p * phi                = 4.3% per 0.01 of p
#   P(sample gets none)   = (1 - p)^(phi * N_c)            ~ exp(-277 p)
#
#      p       E[k]   added atom-token frac   coverage loss   P(k=0)
#   0.005       1.4            2.2%               1.9%         0.25
#   0.010       2.8            4.3%               3.8%         0.06
#   0.020       5.5            8.6%               7.6%         0.004
#   0.050      13.8           21.6%              18.9%         ~0
#
# p = 0.01 is the pick. It adds ~4.3% atom tokens — a bit over half the natural
# 7.6% mean and ~3x the 1.8% median, so the synthetic path augments the real one
# instead of dominating it — while giving up under 4% of the crop's residue
# coverage and firing on 94% of samples. p = 0.02 already adds more atom tokens
# than nature supplies and costs ~8% coverage; treat it as the aggressive arm.
# Note interface-anchored crops (crop_weights interface 0.4) concentrate
# interface residues, so realized k runs ~1.3-1.5x the uniform estimate above.
#
# atomize_max_residues bounds the worst case (every selected residue landing in
# the crop): loss_max = (a_bar - 1) * C / N_c = 1.36% per unit of C. C = 8 caps
# it at 10.9% and clips the giant-assembly tail, where p alone would select ~10
# residues (p90 assembly has ~1000 interface residues).
#
# Depends on the atomized-token frame fix (43d7cdb): before it, atomized tokens
# were dropped from frames_mask, so atomizing interface residues would have
# removed exactly those residues from the PAE frame set and FAPE.

training:
  wandb_project: deepfold3-stage2

model:
  data:
    atomize_prob: 0.01
    atomize_source: interface
    atomize_max_residues: 8
    atomize_eval: false
