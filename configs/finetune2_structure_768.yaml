base: initial.yaml

training:
  max_tokens: 768
  max_atoms: 8192  # 768×10.67 — scaled from 4096 (384-era ~10.67 atoms/tok); 4096 caps protein crops at ~512 tok
  diffusion_batch_size: 32
  diffusion_chunk_size: 8

  alpha_diffusion: 4.0
  alpha_distogram: 0.03
  alpha_confidence: 0.0
  alpha_pae: 0.0
  alpha_bond: 1.0
  alpha_smooth_lddt: 1.0

  finetune_scheduler: cosine
  cosine_max_steps: 20000

  load_strict: true
  skip_load_optimizer: true
  skip_load_scheduler: true
  skip_load_step: true

model:
  data:
    max_chains: 20
