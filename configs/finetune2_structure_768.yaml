base: initial.yaml

training:
  max_tokens: 768
  max_atoms: 4096
  diffusion_batch_size: 32
  diffusion_chunk_size: 16

  alpha_diffusion: 4.0
  alpha_distogram: 0.03
  alpha_confidence: 0.0
  alpha_pae: 0.0
  alpha_bond: 1.0
  alpha_smooth_lddt: 1.0

  finetune_scheduler: cosine
  cosine_max_steps: 20000

  load_strict: true
  skip_load_optimizer: true
  skip_load_scheduler: true
  skip_load_step: true

# Architectural flags must match the upstream stage checkpoints loaded via
# --params (see finetune1_structure_640.yaml header for the full rationale).
model:
  pairformer:
    deepnet_residual_scale: true
  confidence:
    deepnet_residual_scale: true
  data:
    max_chains: 20
