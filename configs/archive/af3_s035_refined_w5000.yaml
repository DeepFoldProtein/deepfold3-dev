base: af3_s035_refined.yaml

# `df3-af3r-s035-w5000` — extended warmup variant of `df3-af3r-s035`.
#
# Single-knob change vs `af3_s035_refined.yaml`: warmup_steps 1000 → 5000.
#
# Rationale: v2 (lr=1.8e-3, warmup=1000) hit eval CE 2.14 at step ~400
# then degraded. Pattern suggests model didn't have enough sub-peak-lr
# learning time before full lr activated destructive (EoS-crossing)
# modes. With s035-named arm's lower peak lr 2.5e-4 + warmup=1000, the
# ramp is already much gentler. But if the same plateau-then-degrade
# pattern recurs, longer warmup may help further:
#
# Mechanism (under wd > 0):
#   * Sub-peak lr period gives wd-mediated activation magnitude
#     equilibration more time to converge BEFORE full lr risks EoS.
#   * Per-step weight change at sub-peak lr is smaller, so weights
#     accumulate gradient signal in productive directions longer
#     before being driven toward EoS-unstable subspaces.
#   * lr×wd accumulates ~lr×wd×steps_at_subpeak (linear) → contraction
#     scales with warmup length.
#
# Predictions vs `af3_s035_refined.yaml`:
#   * Eval CE at matched step ≤ original arm's
#   * Plateau (if any) at lower CE
#   * single_l2 trajectory even more bounded
#   * Trade-off: ~5× slower initial fit-rate (much of training at sub-peak)
#
# Holds constant from `af3_s035_refined.yaml`:
#   - lr 2.5e-4, wd 0.1, grad_clip_norm 100.0
#   - refined SF C=200, EMA 0.999, eval_snapshot=average
#   - AF3 baseline arch (no RMSN, no uniros, no single-track gain)

training:
  warmup_steps: 5000
