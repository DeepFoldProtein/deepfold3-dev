base: initial.yaml

training:
  max_tokens: 768
  max_atoms: 8192  # 768×10.67 — scaled from 4096 (384-era ~10.67 atoms/tok); 4096 caps protein crops at ~512 tok
  diffusion_batch_size: 32
  diffusion_chunk_size: 16

  alpha_diffusion: 0.0
  alpha_distogram: 0.0
  alpha_confidence: 1.0e-4
  alpha_pae: 1.0
  alpha_bond: 1.0
  alpha_smooth_lddt: null
  train_confidence_only: true

  finetune_scheduler: cosine
  cosine_max_steps: 20000

  load_strict: true
  skip_load_optimizer: true
  skip_load_scheduler: true
  skip_load_step: true

model:
  data:
    max_chains: 50
    # Last stage: raise the giant-assembly exclusion to 50 total chains
    # (overrides initial.yaml's 30), mirroring AF3's chain-count schedule.
    max_total_chains: 50
