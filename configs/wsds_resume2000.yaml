base: initial.yaml

# WSD-S resume from df3-20260427-014848/checkpoint_2000.pt.
# Decay starts at step 2000, period = 2000 steps, decay length = 200 steps
# (10% of period — paper-recommended 8–12%). Min LR ratio defaults to 0.01
# (= max_lr * 0.01 = 1.8e-5 at the bottom of each decay window). Between
# windows the LR resumes at max_lr (WSD-S signature behavior — no rollback).
training:
  finetune_scheduler: wsds
  wsds_min_lr_ratio: 0.01
  wsds_decay_windows:
    - [2000, 2200]
    - [4000, 4200]
    - [6000, 6200]
    - [8000, 8200]
    - [10000, 10200]
