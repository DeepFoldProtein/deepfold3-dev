training:
  lr: 0.0018
  # Default 0 here matches the AF3 supplement (no weight decay during
  # initial training). Production runs set this from the optimizer config
  # layered on top — configs/schedule_free.yaml overrides to 0.05 to
  # bound zero-init out_proj weight growth (the PairFormer single-stream
  # divergence diagnosed in df3-sf-bs3-12n-deepnet-20260502-012417). Decay
  # is applied only to matmul weights — LN scales/biases, gates, and
  # input embeddings auto-route to the no-decay group via
  # optim.py:_NO_DECAY_NAME_SUBSTRINGS. See docs/training.md § Optimizer.
  weight_decay: 0.0
  betas: [0.9, 0.95]
  eps: 1.0e-8

  warmup_steps: 1000
  start_decay_after: 50000
  decay_every: 50000
  decay_factor: 0.95
  finetune_scheduler: af3
  cosine_min_lr_ratio: 0.1
  cosine_max_steps: 20000

  grad_clip_norm: 10.0
  grad_norm_fp64: true
  grad_norm_log_threshold: 100.0
  # Per-rank outlier guard: skip the whole step if any rank's pre-clip
  # grad_norm exceeds this. Clipping from 1e+6~1e+8 to max_norm=10 yields
  # random noise direction that degrades the update; skipping is cleaner.
  # 5000 lets the bulk of the heavy-tail (median 1.4k, p90 2.8k observed
  # post-warmup at peak LR) through clip-to-10 instead of dropping ~25% of
  # steps; only catastrophic outliers (>5k, ~5% of former skip events) are
  # still gated.
  grad_norm_skip_threshold: 5000.0
  max_consecutive_nan_skips: 10
  accumulate_grad_batches: 2
  ema_decay: 0.999
  # eval_snapshot: "average" (SF's x — fast response, default) or
  # "shadow" (EMA over x — slow, 1/(1-ema_decay) step lag, matches
  # `deepfold3 inference --snapshot ema/auto`). Training callbacks
  # update shadow regardless; this flag only controls which snapshot
  # is forward-passed during run_eval.
  eval_snapshot: average

  max_tokens: 384
  max_atoms: 4096
  max_msa_seqs: 1024
  max_recycles: 3

  batch_size_per_rank: 2
  diffusion_batch_size: 48
  diffusion_chunk_size: 8
  mini_rollout_steps: 20
  mini_rollout_samples: 1

  alpha_diffusion: 4.0
  alpha_smooth_lddt: 1.0
  alpha_distogram: 0.03
  alpha_confidence: 0.0
  alpha_pae: 0.0
  alpha_bond: 0.0
  nucleotide_loss_weight: 5.0
  ligand_loss_weight: 10.0
  region_loss_weights: {}

  # Magnitude regularizers on trunk outputs (mean per-token Σ_c |x|^p / C).
  # Pair reg bounds DistogramHead logit magnitude; alpha=0 = observation-only.
  single_reg_p: 2
  alpha_single_reg: 0.0
  pair_reg_p: 2
  alpha_pair_reg: 0.0

  lddt_cutoffs: [0.5, 1.0, 2.0, 4.0]
  lddt_inclusion_radius: 15.0
  lddt_nucleotide_inclusion_radius: 30.0
  lddt_min_distance: 1.0e-3
  min_resolution: 0.1
  max_resolution: 4.0

  use_fused_ce_loss: false
  fused_ce_chunk_n: 32

  dtype: bf16
  num_workers: 8
  eval_num_workers: 2
  prefetch_factor: 4
  pin_memory: true
  drop_last: true
  find_unused_parameters: false
  static_graph: true
  bucket_cap_mb: 32
  gradient_as_bucket_view: true
  # NCCL watchdog deadline (also used by ``collective_guard`` to attribute hangs).
  collective_timeout_s: 600.0
  train_confidence_only: false

  max_steps: 100_000
  seed: 42
  checkpoint_interval: 100
  checkpoint_every_hours: 0.0
  eval_samples: 1024
  eval_interval: 100
  eval_before: true
  epoch_size: 12_800_000
  log_interval: 1
  log_microsteps: false
  uniform_recycle: true
  max_checkpoints: 500
  # Always-on per-PF-layer activation RMS sentinel. Logs
  # ``act_rms/pf_in_{single,pair}`` + ``act_rms/pf_{00..47}_{single,pair}``
  # to WandB every ``log_interval`` steps. Compute is two reductions per
  # PF block per forward; one packed all_reduce per log boundary. See
  # :class:`deepfold3.training.activation_meter.ActivationRMSMeter`.
  log_activation_rms: true
  # Multiplier on ``log_interval`` for the act_rms flush cadence. With
  # ``log_interval=1`` and ``act_rms_log_interval=10`` the meter emits one
  # ρ snapshot per 10 effective steps; the meter still accumulates every
  # step locally so window-averaged values are reported (cleaner than
  # per-step noise). Drops WandB cost ~10× without losing the slow-dynamic
  # depth profile.
  act_rms_log_interval: 10

  auto_resume: false
  load_strict: true
  skip_load_optimizer: false
  skip_load_scheduler: false
  skip_load_step: false

  wandb_enabled: true
  wandb_project: deepfold3-stage0
  wandb_run_name: null

datasets:
  - name: patchr
    data_dir: /data/distillation/patchr_training
    weight: 0.5
    strategy: weighted
    is_distillation: false
    format: df3
    cutoff_date: "2021-09-30"
    exclude_loss_mol_types: []

  - name: long_monomers
    data_dir: /data/distillation/long_monomers/preprocessed
    weight: 0.45
    strategy: uniform
    is_distillation: true
    format: of3

  - name: short_monomers
    data_dir: /data/distillation/short_monomers/preprocessed
    weight: 0.05
    strategy: uniform
    is_distillation: true
    format: of3

eval_datasets:
  - name: patchr_eval
    data_dir: /data/distillation/patchr_training
    format: df3
    cutoff_date: "2021-09-30"

model:
  num_recycles: 10
  msa_crop_size: 512
  evoformer:
    num_layer: 4
    msa_channel: 64
    seq_channel: 384
    pair_channel: 128
    msa_dropout: 0.15
    pair_dropout: 0.25
  pairformer:
    num_layer: 48
    pair_channel: 128
    seq_channel: 384
    pair_dropout: 0.25
  diffusion:
    steps: 200
    num_samples: 5
    sigma_data: 16.0
    p_mean: -1.2
    p_std: 1.5
    skip_amp_sample: true
    skip_amp_sample_training: true
  confidence:
    num_layer: 4
    num_plddt_bins: 50
    num_distogram_bins: 64
    max_error_bin: 31.0
  template:
    num_channels: 64
    pairformer:
      num_layer: 2
      pair_dropout: 0.25
  data:
    max_templates: 4
    max_neighborhood: 40
    contiguous_crop_weight: 0.2
    spatial_crop_weight: 0.4
    interface_crop_weight: 0.4
    interface_distance: 15.0
    template_cutoff_days: 60
    max_template_date: "2021-09-30"
    prefer_monomer_templates: true
  optim:
    use_fused_evo_attention: true
    # Disabled: the fused pair-bias backward interacts with the fused
    # evo-attention backward in a bf16 path that amplifies gradients by
    # ~1e11× on specific training samples (reproduced on patchr:7k6p +
    # ckpt_19; see scripts/triage_window.py). Keep fused evo-attn on for
    # memory; fall back to plain LN+Linear pair-bias until the fused
    # backward can be rewritten with fp32-promoted intermediates.
    use_fused_pair_bias: false
    use_fused_swiglu: false
    use_fused_triangle_mul: false
    use_fused_transition_pair: false
    use_fused_ln_transpose: false
    use_tiled_linear: false
    tiled_linear_inference: true
    tiled_opm_chunk: 0
    use_torch_compile: false
    use_gradient_checkpointing: true
  # Mixed-precision policy. Two sets of knobs:
  # - ``fp32_*`` region guards pin numerically sensitive projections to fp32
  #   while the rest of the net runs under bf16 autocast. Flip
  #   ``fp32_distogram_head`` on if the distogram loss shows bursts beyond
  #   its theoretical max (ln(num_bins) ≈ 4.16).
  # - ``{grad_acc,reduce,loss}_dtype`` govern downstream precision axes:
  #   grad accumulation across microsteps, DDP allreduce, and loss computation.
  #   Defaults match pre-refactor DF3 (all fp32). Set ``reduce_dtype: bf16``
  #   to register DDP's bf16_compress hook and halve allreduce bandwidth.
  precision:
    fp32_loss: true
    fp32_confidence_head: true
    fp32_distogram_head: true
    grad_acc_dtype: fp32
    reduce_dtype: fp32
    loss_dtype: fp32
