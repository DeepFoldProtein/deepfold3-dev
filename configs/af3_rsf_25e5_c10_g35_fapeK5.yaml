base: af3_rsf_25e5_c10_g35.yaml

# `df3-fapeK5-25e5-c10-g35` — S3 + carbonyl O (K=5, NCACO+CB atom set).
#
# S3 verdict at step 11000 (9-target bench, n=30/step):
#   * F1_H (α-helix 8-state): 0.49   — solid helix learning, vs af3spec ~0.05
#   * F1_α (3-state):         0.53   — 6× advantage over no-FAPE baseline
#   * F1_β (3-state):         0.10   — flat throughout training
#   * β recall:               ~0.04  — model rarely emits β at all
#   * β precision:            ~0.30  — when it does call β, ~30% correct
#
# Low β F1 is recall-bound, not precision-bound — the model commits to
# "coil everywhere except helix". Confusion matrix at step 10500 shows
# GT-β residues map to coil ~88% / helix ~8% / β ~4%. "Helix eats
# strand" is a minor effect (~8 pp); the dominant mode is **β never
# being predicted at all**.
#
# Hypothesis: the missing supervision is **carbonyl O direction**.
#   * β-strand definition = cross-strand backbone H-bond ladder, where
#     amide N-H ··· O=C alignment between partner strands is the
#     defining geometry.
#   * H-bond donor (N): in K=4 FAPE as frame atom — supervised.
#   * H-bond acceptor (O): not in K=4 FAPE — NOT directly supervised.
#   * Carbonyl direction is set by ψ (N-CA-C-O dihedral), which only
#     gets indirect supervision through N_{j+1} placement via peptide
#     plane planarity. Insufficient gradient for the model to commit
#     to ψ ≈ +120° (strand basin).
#
# Fix: ``fape_atom_set: "NCACO+CB"`` (K=5) — adds slot 4 = backbone O to
# the projected atom set. AF2's §4.2.7 backbone FAPE used exactly
# (N, CA, C, O); we now match that and additionally keep CB for the
# chirality channel S3 needed.
#
# Sidechain (CG, OG, etc.) intentionally NOT in FAPE — smooth_lddt
# covers heavy-atom local distances ≤15 Å, which should be enough
# for sidechain packing supervision. FAPE's job is the rigid-body
# frame, smooth_lddt's job is the cloud.
#
# Config rationale:
#   * α=2.0, clip=20, norm=True (unchanged from S3) — proven operating
#     point. clip=20 retained because strand H-bond supervision needs
#     long-range pair gradient (partner strand O can be sequence-
#     distant; clip=10 would saturate cross-strand error early in
#     training where strand_partner_O may be 15+ Å mis-placed).
#
# Init strategy: from-scratch (random init), matching fapeS3.
# Considered resume-from-S3-ckpt-11500 but rejected — S3's
# coil-everywhere prior is baked into SF x average (c_{t+1} ≈ 0.0017
# at step 11500), and the carbonyl O gradient is asking for a phase
# change (commit to ψ≈+120° basin) that SF inertia would block for
# ~580 step before x catches up. From-scratch gives the cleanest
# 1-knob ablation vs S3 (same setup, atom set NCACO+CB vs NCAC+CB)
# with no init confound; expected verdict in 200-500 step.
#
# Watch milestones (matched-step A/B against fapeS3 trajectory):
#   * step 500-2000: F1_H should track or exceed S3 — the K=4 vs
#     K=5 difference is +CB removal? no — K=5 is strict superset
#     of K=4-AF2 (NCACO). vs S3 (NCAC+CB) trades CB-only for full
#     N/CA/C/O + CB. CB stays; O is added. Helix learning should
#     be ≥ S3.
#   * step 5000: F1_β early differentiation. S3 had ~0.05 by 5000;
#     K5 should be ≥ 0.10 if O carbonyl helps.
#   * step 8500: same-step A/B vs S3 at S3's matched milestone.
#     Expectation: F1_β 0.05 → 0.15+, F1_H within ±0.05 of S3 0.30.
#   * step 11000: matched-step A/B at S3's verdict point.
#     Expectation: F1_β 0.10 → 0.25+, F1_H comparable to S3 0.49.

training:
  alpha_chirality: 0.0
  alpha_backbone_chirality: 0.0
  alpha_fape: 2.0
  fape_clip_distance: 20.0
  fape_normalize: true
  fape_atom_set: "NCACO+CB"
